[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-reconstruction-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
3d-reconstruction-claim-audit = "claim_audit_cli:main"

[tool.setuptools]
py-modules = ["claim_audit_cli"]

[tool.setuptools.packages.find]
include = ["3d_reconstruction_claim_audit*"]
